name: Deploy to EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-ec2-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run tests
        run: ./gradlew test

      - name: Set image name
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=$BRANCH_TAG" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          : "${EC2_HOST:?EC2_HOST secret is required}"
          : "${EC2_USER:?EC2_USER secret is required}"
          : "${EC2_SSH_KEY:?EC2_SSH_KEY secret is required}"
          : "${EC2_APP_DIR:?EC2_APP_DIR secret is required}"
          : "${GHCR_USERNAME:?GHCR_USERNAME secret is required}"
          : "${GHCR_TOKEN:?GHCR_TOKEN secret is required}"

          SSH_PORT="${EC2_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/pickitpickit_ec2
          chmod 600 ~/.ssh/pickitpickit_ec2

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/pickitpickit_ec2 -p "$SSH_PORT" "$EC2_USER@$EC2_HOST" \
            "APP_IMAGE='$APP_IMAGE' EC2_APP_DIR='$EC2_APP_DIR' DEPLOY_BRANCH='$DEPLOY_BRANCH' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$EC2_APP_DIR"
          git fetch origin
          git checkout -f -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"

          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          export APP_IMAGE
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done

          docker compose -f docker-compose.prod.yml logs --tail=200 api
          exit 1
          REMOTE
