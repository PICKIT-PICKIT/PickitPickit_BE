services:
  api:
    image: ${APP_IMAGE}
    container_name: pickitpickit-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
